<!doctype html>
<html lang="ro">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Aplicație Nuntă — Invitati</title>

    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">

    <script>
        tailwind = { config: {
            theme: {
                extend: {
                    colors: {
                        cream: '#F8F4EC',
                        'cream-2': '#F2EDE0',
                        gold: '#C69E45',
                        'gold-dark': '#A77B2E',
                        'accent': '#EADFC8'
                    },
                    fontFamily: {
                        serif: ['"Playfair Display"', 'serif'],
                        sans: ['Inter', 'ui-sans-serif', 'system-ui']
                    }
                }
            }
        } }
    </script>
    <script src="https://cdn.tailwindcss.com"></script>

    <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>

    <style>
        body { background: linear-gradient(180deg, #FFFDF9 0%, #FBF7F1 100%); }
        .glass {
            background: rgba(255,255,255,0.6);
            backdrop-filter: blur(6px);
        }
    </style>
</head>
<body class="min-h-screen font-sans text-gray-800">

    <div id="app" class="min-h-screen flex items-start justify-center py-8 px-6">
        <div class="w-full max-w-2xl">
            <header class="mb-6 text-center">
                <p class="text-sm tracking-widest uppercase text-gray-500 font-medium">
                    Bine ați venit la nunta lui
                 </p>
                <h1 class="font-serif text-4xl md:text-5xl text-[#A77B2E] leading-tight">
                    Natanael <span class="text-gray-400">&</span> Mihaela
                </h1>
            </header>

            <section class="glass p-6 rounded-2xl shadow-xl border border-[rgba(166,132,80,0.12)]">
                <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4 mb-6">
                    <div class="flex flex-col items-center gap-3">
                            <h2 class="pb-0 font-serif text-2xl">Introduceti prenumele dvs.</h2>
                            <p class="mb-2 text-sm text-red-600 text-center">Exemplu: Maricica Nica sau Ionel Nica</p>
                    </div>

                    <div class="flex-1 sm:max-w-sm">
                        <label class="relative block">
                            <input 
                                v-model="query" 
                                type="search" 
                                placeholder="Introduceți numele..." 
                                autocomplete="off" 
                                class="w-full py-3 pl-10 pr-4 rounded-lg border-2 border-[#D4AF37] bg-white/60 focus:outline-none focus:border-[#FFC845] transition transform focus:scale-105 placeholder-gray-400"
                            >
                            <svg class="w-5 h-5 absolute left-3 top-1/2 -translate-y-1/2 text-gold" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="#C69E45">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M21 21l-4.35-4.35M10.5 18a7.5 7.5 0 100-15 7.5 7.5 0 000 15z"/>
                            </svg>
                        </label>
                    </div>
                </div>

                <div v-if="loading" class="py-12 text-center text-gray-500">Se încarcă invitații…</div>
                <div v-else-if="error" class="py-12 text-center text-red-600">Eroare la încărcare: {{ error }}</div>
                <div v-else class="overflow-y-auto max-h-[21.5rem]">
                    <div v-if="!query.trim()" class="py-12 text-center text-gray-400 italic tracking-wide">Sugestiile vor apărea aici.</div>
                    <div v-else>
                        <ul class="grid grid-cols-1 sm:grid-cols-2 gap-2">
                            <li v-for="guest in filteredGuests" :key="guest.id || (guest.prenume + guest.nume)" @click="selectGuest(guest)"
                                class="cursor-pointer flex items-center justify-between gap-1 p-3 rounded-lg border border-[rgba(166,132,80,0.15)] hover:shadow-md transition duration-150 bg-white">
                                <div>
                                    <div class="text-lg font-bold text-gray-800">{{ guest.prenume }} {{ guest.nume }}</div>
                                </div>
                                <div class="relative w-4 h-4 flex-shrink-0">
                                    <span class="absolute inset-0 block w-full h-full bg-white border-2 border-yellow-600 rounded-full"></span>
                                    <span class="absolute top-1/4 left-1/4 w-1/2 h-1/2 bg-yellow-600 rounded-full"></span>
                                </div>
                            </li>
                            <li v-if="filteredGuests.length === 0" class="col-span-full text-center py-8 text-gray-500">Niciun rezultat pentru "{{ query }}"</li>
                        </ul>
                    </div>
                </div>
            </section>

            <div class="fixed -bottom-40 left-0 w-full flex justify-center pointer-events-none -z-10">
                <img src="image.png" alt="Decor" class="w-80 md:w-[500px] opacity-80 object-contain">
            </div>
        </div>
    </div>

    <script>
        const { createApp, ref, onMounted, computed } = Vue;

        createApp({
            setup() {
                const guests = ref([]);
                const loading = ref(true);
                const error = ref(null);
                const query = ref('');

                function normalizeText(s = '') {
                    return s.toString().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').trim();
                }

                const filteredGuests = computed(() => {
                    const qStr = query.value.trim();
                    if (!qStr) return [];
                    
                    // Transformăm ce scrie utilizatorul într-o listă de cuvinte (ex: ["ionel", "nica"])
                    const queryWords = normalizeText(qStr).split(/\s+/).filter(w => w.length > 0);

                    const out = [];
                    const seen = new Set();

                    for (const g of guests.value) {
                        const prenumeRaw = g.prenume || '';
                        const numeRaw = g.nume || '';

                        // Creăm un "pool" de cuvinte disponibile pentru acest rând din baza de date
                        // Din "Maricica & Ionel" + "Nica" obținem ["maricica", "ionel", "nica"]
                        const availableText = normalizeText(`${prenumeRaw} ${numeRaw}`);
                        const availableWords = availableText.split(/[\s&]+/).filter(w => w.length > 0);

                        // Verificăm dacă TOATE cuvintele tastate de utilizator se regăsesc printre cuvintele invitatului
                        // (sau măcar încep cu ele, pentru a oferi sugestii în timp ce tastează)
                        const allWordsMatch = queryWords.every(qWord => 
                            availableWords.some(aWord => aWord.startsWith(qWord))
                        );

                        if (allWordsMatch) {
                            const key = (prenumeRaw + '|' + numeRaw).toLowerCase();
                            if (!seen.has(key)) {
                                seen.add(key);
                                out.push(g);
                            }
                        }
                    }

                    // Sortare simplă după prenume
                    return out.sort((a, b) => (a.prenume || '').localeCompare(b.prenume || ''));
                });

                function selectGuest(guest) {
                    const full = ((guest.prenume || '') + ' ' + (guest.nume || '')).trim();
                    const params = new URLSearchParams();
                    params.set('name', full);
                    if (guest.masa !== undefined) params.set('masa', String(guest.masa));
                    if (guest.prenume) params.set('prenume', guest.prenume);
                    if (guest.nume) params.set('nume', guest.nume);
                    if (guest.informatii) params.set('informatii', guest.informatii);
                    
                    try { sessionStorage.setItem('selectedGuest', JSON.stringify(guest)); } catch (e) {}
                    window.location.href = 'seat.html?' + params.toString();
                }

                onMounted(async () => {
                    try {
                        const res = await fetch('invitati.json', { cache: 'no-store' });
                        if (!res.ok) throw new Error(res.status);
                        const data = await res.json();
                        guests.value = Array.isArray(data) ? data : (data.invitați || data.invitati || data.guests || []);
                    } catch (err) {
                        error.value = 'Eroare la încărcarea listei.';
                    } finally {
                        loading.value = false;
                    }
                });

                return { guests, loading, error, query, filteredGuests, selectGuest };
            }
        }).mount('#app');
    </script>
</body>
</html>
